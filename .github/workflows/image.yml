# Every push to main publishes the storefront's image for the ThinkPad,
# ghcr.io/<owner>/paribelle-web, and tells the ThinkPad, which updates straight away
# (pom's infra/hook.mjs). Vercel builds the same push, as before, for the fallback.
#
# NEXT_PUBLIC_* values are built in. They're production's, except the API's address:
# pages from the ThinkPad call api.paribelle.in (the edge Worker: the ThinkPad's API
# first, Render's when it can't answer); Vercel's keep calling Render directly.
name: image

on:
  push: { branches: [main] }
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/paribelle-web" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.paribelle.in
            NEXT_PUBLIC_APP_URL=https://www.paribelle.in
            NEXT_PUBLIC_LOOKBOOK_ENABLED=false
            NEXT_PUBLIC_COD_ENABLED=false
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is up: tell the ThinkPad, so it updates now (pom's infra/hook.mjs).
      # Without the secret, or if it doesn't answer, it still does at its next 5-minute check.
      - name: Tell the ThinkPad
        env: { KEY: "${{ secrets.THINKPAD_DEPLOY_KEY }}" }
        run: |
          [ -n "$KEY" ] || { echo "No THINKPAD_DEPLOY_KEY secret: the ThinkPad updates at its next 5-minute check."; exit 0; }
          curl -fsS --max-time 20 --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $KEY" -H "X-Paribelle-Repo: $GITHUB_REPOSITORY" \
            https://laptop.paribelle.in/_paribelle/deploy ||
            echo "::warning::The ThinkPad didn't answer; it updates at its next 5-minute check."
